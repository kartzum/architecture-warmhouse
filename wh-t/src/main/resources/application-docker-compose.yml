spring:
  application:
    name: wh_t

  docker:
    compose:
      enabled: true
      file: docker-compose.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      register-mbeans: true
      minimum-idle: 2
      maximum-pool-size: 5
